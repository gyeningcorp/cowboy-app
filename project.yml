name: Cowboy
options:
  bundleIdPrefix: com.innercircle
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  swift: "5.9"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "4LZJ7U5FHS"
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO

targets:
  Cowboy:
    type: application
    platform: iOS
    sources:
      # Folder scan auto-classifies files: .swift -> Sources, game.html &
      # Assets.xcassets -> Resources (Copy Bundle Resources). Do NOT use a
      # top-level `resources:` key — XcodeGen ignores it, which previously
      # dropped game.html from the bundle. Do NOT exclude game.html here.
      - path: Cowboy
        excludes:
          - "Info.plist"
    # No `info:` key: that makes XcodeGen GENERATE (overwrite) Info.plist,
    # stripping the real one (display name, encryption flag, orientation lock,
    # hidden status bar). We ship the committed Info.plist via INFOPLIST_FILE.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.innercircle.cowboy
        INFOPLIST_FILE: Cowboy/Info.plist
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Cowboy:
    build:
      targets:
        Cowboy: all
    run:
      config: Debug
    archive:
      config: Release
